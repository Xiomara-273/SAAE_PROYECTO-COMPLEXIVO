services:
  # Base de Datos PostgreSQL Producción
  db:
    image: postgres:16-alpine
    container_name: saae-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saae_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CambiarEstaClaveSegura2026!}
      POSTGRES_DB: ${POSTGRES_DB:-saae_prod_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saae_prod_user} -d ${POSTGRES_DB:-saae_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend NestJS + Prisma Producción
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saae-backend-prod
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgresql://saae_prod_user:CambiarEstaClaveSegura2026!@db:5432/saae_prod_db?schema=public}
      JWT_SECRET: ${JWT_SECRET:-ClaveSecretaProduccionSAAE_9847128374918237491}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/saae-eventos}
      N8N_API_KEY: ${N8N_API_KEY:-ClaveAPISecretaN8N_Produccion_2026}
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy

  # Frontend Angular + Nginx Producción
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saae-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

  # n8n Automation Producción
  n8n:
    image: n8nio/n8n:latest
    container_name: saae-n8n-prod
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_prod_data:/home/node/.n8n

volumes:
  postgres_prod_data:
  n8n_prod_data:
