<header class="header">

  <div class="header-title">

    <h2>
      {{ 'header.title' | translate }}
    </h2>

    <span>
      {{ 'header.subtitle' | translate }}

  </div>


  <div class="header-user">

    <div class="user-info">

      <strong>
        {{ 'header.user' | translate }}

        {{ 'header.role' | translate }}

    </div>


    <div class="avatar">

      👤

    </div>


  </div>


</header>
